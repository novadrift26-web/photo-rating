<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>照片评分网站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">📸 照片评分墙</h1>
            <a href="/upload" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">上传新照片</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% for filename, info in photos.items() %}
            <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col">
                <img src="{{ url_for('static', filename='uploads/' + filename) }}" class="h-48 w-full object-cover">
                <div class="p-4 flex-1 flex flex-col justify-between">
                    <div>
                        <p class="text-gray-700 font-medium truncate">{{ filename }}</p>
                        <p class="text-sm text-gray-500 mt-1">平均分: <span class="text-orange-500 font-bold text-lg">{{ info.average }}</span>分 ({{ info.count }}人评价)</p>
                    </div>
                    
                    <div class="mt-4 pt-3 border-t border-gray-100">
                        <p class="text-xs text-gray-400 mb-2">给它打个分：</p>
                        <div class="flex justify-between">
                            {% for score in range(1, 6) %}
                            <form action="/rate/{{ filename }}/{{ score }}" method="POST">
                                <button type="submit" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-blue-500 hover:text-white text-gray-700 text-sm font-semibold transition">
                                    {{ score }}
                                </button>
                            </form>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-span-3 text-center py-12 text-gray-400">
                还没有上传任何照片，快去上传一张吧！
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
